packages:
  - "."
  - "e2e"

overrides:
  esbuild: '>=0.28.1'
  # undici bewusst bei 7.x (jsdom@29 importiert interne undici-7-Pfade), aber >= 7.29.1
  # (mehrere GHSA, u.a. GHSA-2gqq-gqf2-x968, GHSA-8436-99hf-9mmv). Dev-/Test-Tooling.
  undici: '>=7.29.1 <8'
  # mocha (ueber e2e > @wdio/mocha-framework) deklariert weiterhin `^6.0.2`,
  # aber jede 6.x-Version ist verwundbar (GHSA-5c6j-r48x-rmvq RCE,
  # GHSA-qj8w-gfj5-8c6v DoS) -- gefixt erst ab 7.0.5. Ungenutzt in unserem
  # Setup (nur der "spec"-Reporter laeuft), aber pnpm audit flaggt den
  # deklarierten Graphen unabhaengig von der tatsaechlichen Nutzung.
  serialize-javascript: '>=7.0.5'
  # fast-xml-parser (ueber e2e > @wdio/cli > ... > edgedriver) < 5.10.1:
  # GHSA-8r6m-32jq-jx6q, wiederholte DOCTYPE-Deklarationen setzen das
  # Entity-Expansion-Limit zurueck. Nur E2E-Tooling, kein Runtime-Pfad.
  fast-xml-parser: '>=5.10.1'
  # postcss (ueber vite) <= 8.5.17: GHSA-r28c-9q8g-f849, Path Traversal ueber
  # Previous-Source-Map-Auto-Loading (sourceMappingURL) legt beliebige
  # .map-Dateien offen.
  postcss: '>=8.5.18'
  # brace-expansion (ueber e2e > @wdio/cli > ... > minimatch/glob) < 5.0.8:
  # GHSA-mh99-v99m-4gvg, ReDoS ueber unbegrenzte Expansion-Laenge. Nur
  # E2E-Tooling, kein Runtime-Pfad.
  # Je Major gepatcht statt global auf 5.x: minimatch@9 importiert `default` (CJS/2.x-Form),
  # ein globales >=5 liess wdio in CI mit SyntaxError abstuerzen.
  'brace-expansion@1': '>=1.1.21 <2'
  'brace-expansion@2': '>=2.1.7 <3'
  # Weitere Funde aus dem pnpm-audit-Lauf vom 2026-10-09 (alle transitiv ueber Dev-/Test-/
  # Build-Tooling: vitest, jsdom, @wdio/*, vite; nichts davon steckt in der ausgelieferten App).
  # Auf die jeweils gepatchte Mindestversion gehoben.
  basic-ftp: '>=6.2.1'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  deepmerge-ts: '>=8.0.0'
  ip-address: '>=10.7.1'
  js-yaml: '>=4.3.2'
  nanoid: '>=3.3.18'
  smol-toml: '>=1.8.1'
  source-map-js: '>=1.2.2'

# Funde ohne gepatchtes Release auf der Registry (extract-zip max 2.0.1, braces max 3.0.3),
# nur ueber e2e > @wdio/* (Test-Tooling, nicht in der ausgelieferten App). Bewusst akzeptiert;
# entfernen, sobald wdio/Upstream gepatchte Versionen zieht.
auditConfig:
  ignoreGhsas:
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-jmr9-qjv8-65gv
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  # edgedriver/geckodriver sind transitive @wdio/cli-Deps fuer Browser-Treiber-
  # Auto-Install -- wir nutzen tauri-driver extern, kein Browser-Treiber-Download.
  edgedriver: false
  esbuild: true
  geckodriver: false
  lefthook: true
